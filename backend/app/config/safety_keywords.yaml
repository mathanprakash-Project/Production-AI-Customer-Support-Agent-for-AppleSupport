# Safety & Compliance Governance Rules for TweetSupport AI Co-Pilot

# Approved Apple URLs (any other URL generated by the model will be flagged as hallucinated)
approved_domains:
  - "apple.com"
  - "support.apple.com"
  - "iforgot.apple.com"
  - "reportaproblem.apple.com"
  - "checkcoverage.apple.com"
  - "locate.apple.com"
  - "getsupport.apple.com"
  - "beta.apple.com"

# Unauthorized promises that support agents/LLMs must NEVER make in public tweets
unauthorized_promises:
  - "guarantee"
  - "we promise"
  - "100% free"
  - "full refund guaranteed"
  - "will replace your device for free"
  - "replace it immediately"
  - "new phone will be sent"
  - "promise this will fix"
  - "will be fixed in 24 hours"
  - "instant refund"

# Medical advice terms that must never be provided
medical_terms:
  - "diagnosis"
  - "medical condition"
  - "consult your doctor"
  - "prescribe"
  - "heart rate disease"
  - "ecg diagnosis"
  - "seizure"

# Canned robot phrases to discourage (brand voice guidelines)
discouraged_phrases:
  - "sorry for the inconvenience"
  - "as per company policy"
  - "that is not our fault"
  - "you must have dropped it"
  - "user error"

# Tone and safety requirements
brand_voice:
  max_tweet_chars: 280
  max_dm_chars: 500
  required_tone: "warm, professional, empathetic, actionable"

