apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: tweet-support
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: us-east1-docker.pkg.dev/tweet-support/applesupport-repo/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:postgres123@db.tweet-support.svc.cluster.local:5432/tweetsupport"
            - name: LLM_PROVIDER
              value: "mock" # Or "ollama" / "groq" / "openai"
            - name: OLLAMA_BASE_URL
              value: "http://ollama-service.tweet-support.svc.cluster.local:11434"
            - name: CORS_ORIGINS
              value: '["*"]'
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: tweet-support
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: backend

